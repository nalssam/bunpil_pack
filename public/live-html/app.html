<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Live HTML</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",sans-serif}
  #poster{position:absolute;left:0;top:0;width:100%;height:100%;border:0;display:none;object-fit:contain}
  #view{position:absolute;left:0;top:0;border:0;background:transparent;visibility:hidden}
  #panel{position:absolute;left:0;top:0;right:0;bottom:0;display:none;background:#f4f1ea;color:#1d1b16;text-align:center;overflow:auto}
  #panel .in{max-width:560px;margin:0 auto;padding:6% 24px}
  #panel h1{font-size:22px;margin:0 0 12px}
  #panel p{font-size:14px;margin:0 0 14px;color:#5f5a50;line-height:1.6}
  #panel .row{margin:10px 0}
  #panel input[type=number]{width:64px;padding:7px;font-size:14px}
  .btn{display:inline-block;background:#1d1b16;color:#fff;border:0;border-radius:999px;padding:10px 20px;font-size:14px;cursor:pointer;margin:4px}
  .btn.line{background:transparent;color:#1d1b16;border:1px solid #1d1b16}
  #msg{font-size:13px;color:#c2452d;min-height:18px}
  #note{position:absolute;left:0;right:0;bottom:0;display:none;background:#1d1b16;color:#fff;font-size:13px;line-height:1.5;padding:8px 14px;text-align:center}
  #gear{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;border:0;background:#1d1b16;color:#fff;font-size:15px;line-height:28px;padding:0;cursor:pointer;opacity:0;display:none}
  body.edit #gear{display:block}
  body.edit:hover #gear{opacity:.45}
  body.edit #gear:hover,body.edit #gear:focus{opacity:1}
</style>
</head>
<body>
<img id="poster" alt="">
<iframe id="view" title="Live HTML" sandbox="allow-scripts allow-forms allow-popups allow-pointer-lock allow-downloads"
        allow="autoplay; fullscreen"></iframe>
<button id="gear" type="button" title="HTML 바꾸기" aria-label="HTML 바꾸기">&#9881;</button>
<div id="note"></div>

<div id="panel"><div class="in">
  <h1>Live HTML</h1>
  <p id="lead">이 슬라이드에서 실행할 HTML 파일을 고르세요. HTML은 프레젠테이션 파일 안에 저장되고, 어디로도 전송되지 않습니다.</p>
  <div class="row">
    <label class="btn" for="file">HTML 파일 고르기</label>
    <input id="file" type="file" accept=".html,.htm,text/html" style="position:absolute;left:-9999px">
  </div>
  <div class="row">이 슬라이드에 보여 줄 번호 <input id="slideNo" type="number" min="1" value="1"></div>
  <div class="row"><button id="apply" type="button" class="btn line" style="display:none">번호만 바꾸기</button>
    <button id="cancel" type="button" class="btn line" style="display:none">닫기</button></div>
  <div id="msg"></div>
</div></div>

<script>
/* Live HTML — PowerPoint 콘텐츠 추가 기능.
   프레젠테이션 파일 안(추가 기능 설정값)에 저장된 HTML을 꺼내 격리된 프레임에서 실행한다.
   이 페이지는 서버로 아무것도 보내지 않는다. 구형 웹뷰에서도 안내가 뜨도록 ES5 문법만 쓴다. */
(function () {
  'use strict';
  var view = document.getElementById('view');
  var poster = document.getElementById('poster');
  var panel = document.getElementById('panel');
  var note = document.getElementById('note');
  var msg = document.getElementById('msg');
  var state = { html: '', slide: 1, w: 1920, h: 1080, poster: '' };
  var settings = null;
  var inOffice = false;
  var started = false;
  var MAX_CHARS = 1900000;

  function fit() {
    var W = window.innerWidth, H = window.innerHeight;
    var k = Math.min(W / state.w, H / state.h);
    view.style.width = state.w + 'px';
    view.style.height = state.h + 'px';
    var t = 'translate(' + (W - state.w * k) / 2 + 'px,' + (H - state.h * k) / 2 + 'px) scale(' + k + ')';
    view.style.transformOrigin = '0 0';
    view.style.webkitTransform = t;
    view.style.transform = t;
  }
  window.addEventListener('resize', fit);

  var LEGACY_NOTE = '이 PowerPoint의 웹 엔진이 오래되어 HTML을 실행할 수 없습니다. Microsoft 365 또는 Office 2021 이상에서 열어 주세요.';
  function modern() {
    // IE11(Trident)·구형 Edge 웹뷰(Office 2016·2019 등)는 srcdoc 이 없고 최신 문법을 실행하지 못한다.
    var ua = navigator.userAgent || '';
    return ('srcdoc' in document.createElement('iframe')) && !document.documentMode &&
      ua.indexOf('Trident') === -1 && ua.indexOf('Edge/') === -1;
  }

  var revealTimer = null;
  function reveal() { clearTimeout(revealTimer); view.style.visibility = 'visible'; }

  function showNote(text) { note.textContent = text; note.style.display = text ? 'block' : 'none'; }

  /* 덱 안으로 끼워 넣는 작은 스크립트: 슬라이드 번호를 알려 주고,
     덱이 쓰지 않는 넘김 키(→ ← PageDown PageUp 등)를 PowerPoint 로 돌려보낸다. */
  function bridge(slide) {
    return '<script>(function(){window.__LIVE_SLIDE__=' + Number(slide) + ';'
      + 'function say(a,n){try{parent.postMessage({liveHtml:1,action:a,n:n},"*")}catch(e){}}'
      + 'window.liveSlide={index:' + Number(slide) + ',keys:true,next:function(){say("next")},prev:function(){say("prev")},'
      + 'first:function(){say("first")},last:function(){say("last")},goTo:function(n){say("goto",n)}};'
      + 'document.addEventListener("DOMContentLoaded",function(){say("ready")});'
      + 'window.addEventListener("keydown",function(e){if(window.liveSlide.keys===false||e.defaultPrevented||e.ctrlKey||e.altKey||e.metaKey)return;'
      + 'var t=e.target||{},g=(t.tagName||"").toUpperCase();'
      + 'if(g==="INPUT"||g==="TEXTAREA"||g==="SELECT"||t.isContentEditable)return;'
      + 'var k=e.key;if(k==="PageDown"||k==="ArrowRight"||k==="Right"){say("next");}'
      + 'else if(k==="PageUp"||k==="ArrowLeft"||k==="Left"){say("prev");}'
      + '},false);})();<\/script>';
  }

  function inject(html, slide) {
    var boot = bridge(slide);
    var m = /<head[^>]*>/i.exec(html);
    if (m) { return html.slice(0, m.index + m[0].length) + boot + html.slice(m.index + m[0].length); }
    return boot + html;
  }

  function render() {
    panel.style.display = 'none';
    showNote('');
    if (state.poster) { poster.src = state.poster; poster.style.display = 'block'; }
    if (!state.html) { openPanel(); return; }
    if (!modern()) { showNote(LEGACY_NOTE); return; }
    fit();
    view.style.visibility = 'hidden';
    view.onload = reveal;
    clearTimeout(revealTimer);
    revealTimer = setTimeout(reveal, 3000);   // 외부 자원이 늦어도 화면은 보여 준다
    view.srcdoc = inject(state.html, state.slide);
  }

  function openPanel() {
    msg.textContent = '';
    document.getElementById('slideNo').value = state.slide;
    document.getElementById('cancel').style.display = state.html ? 'inline-block' : 'none';
    document.getElementById('apply').style.display = state.html ? 'inline-block' : 'none';
    panel.style.display = 'block';
  }

  function load() {
    if (settings) {
      state.html = settings.get('html') || '';
      state.slide = parseInt(settings.get('slide'), 10) || 1;
      state.w = parseInt(settings.get('width'), 10) || 1920;
      state.h = parseInt(settings.get('height'), 10) || 1080;
      state.poster = settings.get('poster') || '';
    }
    render();
  }

  function save() {
    if (!settings) { return; }
    settings.set('html', state.html);
    settings.set('slide', state.slide);
    settings.set('width', state.w);
    settings.set('height', state.h);
    settings.set('poster', state.poster || '');
    settings.saveAsync(function (r) {
      if (r.status !== 'succeeded') {
        msg.textContent = '저장하지 못했습니다: ' + ((r.error && r.error.message) || '');
        openPanel();
      }
    });
  }

  /* 덱 → PowerPoint: 슬라이드 넘기기 */
  function go(action, n) {
    if (!inOffice) { return; }
    try {
      var doc = Office.context.document;
      if (action === 'goto') { doc.goToByIdAsync(parseInt(n, 10), Office.GoToType.Index, function () {}); return; }
      var map = { next: Office.Index.Next, prev: Office.Index.Previous, first: Office.Index.First, last: Office.Index.Last };
      if (map[action]) { doc.goToByIdAsync(map[action], Office.GoToType.Index, function () {}); }
    } catch (e) { /* 이 버전의 PowerPoint 가 지원하지 않으면 조용히 넘어간다 */ }
  }
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (e.source !== view.contentWindow || !d || d.liveHtml !== 1) { return; }
    if (d.action === 'ready') { reveal(); return; }
    go(String(d.action), d.n);
  });

  function setView(v) { document.body.className = (v === 'edit') ? 'edit' : ''; if (v !== 'edit' && state.html) { panel.style.display = 'none'; } }

  document.getElementById('file').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) { return; }
    var rd = new FileReader();
    rd.onload = function () {
      var text = String(rd.result);
      if (text.length > MAX_CHARS) { msg.textContent = 'HTML이 너무 큽니다(약 1.9MB까지). 큰 그림이나 글꼴을 줄여 주세요.'; return; }
      state.html = text;
      state.poster = '';
      poster.style.display = 'none';
      state.slide = parseInt(document.getElementById('slideNo').value, 10) || 1;
      save(); render();
    };
    rd.onerror = function () { msg.textContent = '파일을 읽지 못했습니다.'; };
    rd.readAsText(f);
    this.value = '';
  });
  document.getElementById('apply').addEventListener('click', function () {
    state.slide = parseInt(document.getElementById('slideNo').value, 10) || 1;
    save(); render();
  });
  document.getElementById('gear').addEventListener('click', openPanel);
  document.getElementById('cancel').addEventListener('click', function () { if (state.html) { panel.style.display = 'none'; } });

  function start(office) {
    if (started) { return; }
    started = true;
    inOffice = office;
    if (office) {
      try { settings = Office.context.document.settings; } catch (e) { settings = null; }
      try {
        Office.context.document.getActiveViewAsync(function (r) { if (r.status === 'succeeded') { setView(r.value); } });
        Office.context.document.addHandlerAsync(Office.EventType.ActiveViewChanged, function (a) { setView(a.activeView); });
      } catch (e) { setView('edit'); }
    } else {
      document.getElementById('lead').textContent = 'PowerPoint 밖에서 연 미리보기입니다. HTML 파일을 고르면 이 화면에서 실행해 볼 수 있습니다(저장되지 않습니다).';
      setView('edit');
    }
    load();
  }

  // 구형 엔진에서는 Office 구성 요소가 끝내 준비되지 않을 수 있으므로 안내부터 띄운다.
  if (!modern()) { showNote(LEGACY_NOTE); }

  if (window.Office && Office.onReady) {
    // PowerPoint 안에서는 host 가 채워져 오고, 일반 브라우저에서는 host 없이 곧바로 돌아온다.
    Office.onReady(function (info) { start(!!(info && info.host)); });
    setTimeout(function () {
      if (!started && modern()) { showNote('PowerPoint와 연결하는 데 시간이 걸리고 있습니다. 인터넷 연결을 확인하고, 계속 이러면 슬라이드를 다시 열어 주세요.'); }
    }, 20000);
  } else {
    // office.js 를 불러오지 못했다(인터넷 연결 문제 등). PowerPoint 안인지조차 알 수 없으므로 안내만 띄운다.
    showNote('Office 구성 요소를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 슬라이드를 다시 열어 주세요.');
  }
})();
</script>
</body>
</html>
