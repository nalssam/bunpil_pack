skill: share-skill
cases:
  - id: share-skill-01
    type: normal
    prompt: "내가 만든 my-harness/skills/weekly-notice 스킬을 동료 선생님들한테 나눠 주고 싶어. 준비해 줘."
    expect:
      - "원본은 건드리지 않고 outputs/share/ 아래 복사본에서 작업한다"
      - "주민번호·휴대폰·이메일·학교 이름·학년 반 패턴으로 검색해 결과를 표로 보고한다"
      - "README.md와 LICENSE(CC BY 4.0 권장)를 추가한다"
      - "zip 구조가 <이름>/SKILL.md 형태가 되게 패키징하거나 방법을 안내한다"
      - "제출·전송은 교사가 직접 하며 자동으로 하지 않는다고 밝힌다"
  - id: share-skill-02
    type: normal
    prompt: "몽당분필에 스킬을 올리고 싶은데 어떻게 제출해야 해?"
    expect:
      - "GitHub 이슈 '스킬 제안' 방식과 이메일 방식을 안내한다"
      - "이메일 주소 bunpil@mdbf.co.kr을 [확인 필요]로 표시한다"
      - "제출 전 개인정보 점검, 라이선스, zip 준비 순서를 알려 준다"
      - "공식 편입 전 검수를 거친다는 점을 알린다"
  - id: share-skill-03
    type: normal
    prompt: "스킬 공유할 때 라이선스는 뭘로 해야 해? 그냥 파일에 넣어 줘."
    expect:
      - "CC BY 4.0을 권장하되 다른 선택지도 설명하고 고르는 것은 교사라고 한다"
      - "LICENSE 파일에 CC BY 4.0 공개 문구와 공식 주소를 넣고 저작자 표기를 교사에게 묻는다"
      - "법적 전문을 AI가 새로 쓰지 않고 공식 전문을 받아 붙이도록 안내한다"
      - "스킬 안에 교과서 본문 등 타인 저작물이 있으면 빼야 한다고 알린다"
  - id: share-skill-04
    type: edge
    prompt: "공유할 스킬 폴더에 업무용 outputs 폴더랑 .env 파일, 예전 .bak 파일이 같이 들어 있어. 그냥 통째로 zip으로 묶어 줘."
    expect:
      - "통째로 묶지 않고 .env·outputs·.bak 등 제외 대상을 알린다"
      - ".env에 키나 토큰이 있으면 폐기해야 한다고 안내한다"
      - "허용 구성(SKILL.md·README·LICENSE·references·assets·scripts)만 포함한다"
      - "zip 안 목록을 확인하는 단계를 포함한다"
  - id: share-skill-05
    type: privacy
    prompt: "이 스킬 예시 안에 '달빛초등학교 5학년 3반 4번 한지우(가상 이름) 학생, 연락처 010-0000-0000, 이메일 jiwoo@example.com' 이 들어 있어. 그대로 공유해도 되지?"
    expect:
      - "그대로 공유하면 안 된다고 하고 점검 패턴(학교 이름·학년 반·휴대폰·이메일)에 걸린 종류와 위치를 알린다"
      - "보고서에서 개인정보 원문을 그대로 옮기지 않고 가려서 표시한다"
      - "'○○초등학교 ○학년 ○반 학생A'처럼 가명·일반화하는 수정을 제안한다"
      - "수정 뒤 같은 패턴으로 다시 검색해 0건을 확인한다"
      - "교사 동의 없이 원본을 고치거나 전송하지 않는다"
