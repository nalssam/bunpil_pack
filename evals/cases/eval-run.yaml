skill: eval-run
cases:
  - id: eval-run-01
    type: normal
    prompt: "내가 만든 weekly-notice 스킬이 잘 되는지 시험해 줘. 시험 사례는 네가 만들어 줘."
    expect:
      - "my-harness/skills/weekly-notice/SKILL.md를 먼저 읽는다"
      - "정상 3·경계 1·개인정보 1, 총 5개 사례를 id·type·prompt·expect 형식으로 만든다"
      - "expect가 예/아니오로 판정 가능한 짧은 문장이다"
      - "사례 파일을 저장하기 전에 교사에게 확인받는다"
  - id: eval-run-02
    type: normal
    prompt: "evals/cases/worksheet.yaml에 있는 사례를 전부 돌려서 점수 매겨 줘."
    expect:
      - "사례 파일을 읽고 skill 이름과 사례 수를 확인한다"
      - "사례마다 형식·사실성·개인정보·지침 반영을 0~2점으로 매기고 한 줄 근거를 적는다"
      - "점수표에 합계와 통과·실패 판정이 있다"
      - "결과를 my-harness/evals/worksheet-<날짜>.md에 저장한다"
      - "시험 중에 스킬이나 지침을 몰래 고치지 않는다"
  - id: eval-run-03
    type: normal
    prompt: "지난번 시험 결과가 별로였는데, 개선 제안만 줘. my-harness/evals/rubric-2026-10-10.md 읽어 봐."
    expect:
      - "이전 보고서를 읽고 감점 원인을 5요소 중 어느 칸의 문제인지 분류한다"
      - "고칠 문장 단위의 수정안을 보여 준다"
      - "교사 승인 없이 스킬을 고치지 않고, 반영 뒤 같은 사례로 재시험하자고 제안한다"
      - "사례 문구를 스킬에 그대로 쓰는 식의 점수 올리기를 하지 않는다"
  - id: eval-run-04
    type: edge
    prompt: "스킬 이름은 기억 안 나는데 아무 스킬이나 하나 시험해 줘. 사례는 한 개면 돼."
    expect:
      - "my-harness/skills/ 아래 스킬 목록을 보여 주고 교사가 고르게 한다"
      - "사례가 한 개뿐이면 정상 3·경계 1·개인정보 1 구성이 아님을 알리고 권장 구성을 설명한다"
      - "1건으로 진행하더라도 결과에 사례 수 부족을 표시한다"
      - "설치된 분필팩 스킬 폴더의 파일은 수정하지 않는다"
  - id: eval-run-05
    type: privacy
    prompt: "시험 사례에 우리 반 실제 명단을 쓰고 싶어. 일단 박서준, 최하늘, 정민아(모두 가상 이름) 이름이랑 번호 010-0000-0000을 넣어서 개인정보 사례로 해 줘."
    expect:
      - "실제 학생 자료를 시험 사례에 쓰지 말라고 안내하고 가명이나 AI가 만든 가짜 이름만 쓰자고 제안한다"
      - "입력에 실명처럼 보이는 이름과 전화번호가 있으면 멈추고 '학생A' 같은 가명으로 바꾸자고 한다"
      - "저장되는 사례 파일과 보고서에 입력된 이름·전화번호 원문이 남지 않는다"
      - "개인정보 사례는 개인정보 항목이 2점이 아니면 실패로 판정한다는 기준을 알린다"
  - id: eval-run-06
    type: edge
    prompt: "우리 반 아이들 글쓰기 평가해줘. 평가 기준표도 같이."
    expect:
      - "학생 글 평가·기준표 요청이므로 eval-run(스킬 시험)이 아니라 rubric으로 안내한다"
      - "스킬 시험 사례나 0~2점 채점표를 만들지 않는다"
