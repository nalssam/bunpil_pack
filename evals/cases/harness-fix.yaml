skill: harness-fix
cases:
  - id: harness-fix-01
    type: normal
    prompt: "또 틀렸네. 학습지가 1단으로 나왔잖아. 다음부터는 학습지는 항상 2단으로 만들어 줘."
    expect:
      - "실수를 한 문장으로 요약해 보여 준다"
      - "서로 다른 강도의 규칙 후보 2개를 제시하고 교사가 고르기 전에는 파일을 수정하지 않는다"
      - "선택된 규칙을 CLAUDE.md와 AGENTS.md 양쪽에 같은 문장으로 추가한다(없으면 만든다)"
      - "my-harness/rules.md에도 날짜와 함께 기록한다"
      - "logs/failure-log.md에 날짜·문제·원인·수정한 규칙·재시험 결과 열로 기록한다"
      - "같은 요청을 다시 실행해 재시험하자고 제안한다"
  - id: harness-fix-02
    type: normal
    prompt: "가정통신문 쓸 때 날짜를 맘대로 만들어서 쓰는데, 이거 규칙으로 해 줘. 모르는 날짜는 비워 두라고."
    expect:
      - "원인을 지침에 규칙이 없었음(추정)처럼 짧게 적는다"
      - "'날짜를 지어내지 않고 [확인 필요]로 표시한다' 취지의 후보 2개를 낸다"
      - "규칙을 한 줄 이다체 행동 문장으로 쓴다"
      - "CLAUDE.md·AGENTS.md·my-harness/rules.md 세 곳에 똑같이 반영한다"
  - id: harness-fix-03
    type: normal
    prompt: "다음부터는 지도안 쓸 때 발문 예시랑 예상 학생 반응도 꼭 넣어 줘."
    expect:
      - "이번 한 번이 아니라 앞으로 계속인지 확인하거나 계속으로 판단한다"
      - "범위가 좁은 후보와 넓은 후보를 제시한다"
      - "기존 규칙과 겹치는지 비교하고 중복이면 추가하지 않고 알린다"
      - "실패 기록에 재시험 결과 칸을 남긴다"
  - id: harness-fix-04
    type: edge
    prompt: "예전에 '학습지는 항상 1단으로 만든다'고 규칙을 넣었는데, 이제는 '학습지는 2단으로 만든다'로 하고 싶어. 그냥 추가해 줘."
    expect:
      - "기존 규칙과 새 규칙이 모순임을 감지해 저장하기 전에 멈춘다"
      - "기존 규칙 교체, 적용 범위 나누기, 새 규칙 취소 같은 선택지를 교사에게 제시한다"
      - "교사의 선택 전에는 CLAUDE.md·AGENTS.md를 수정하지 않는다"
      - "교체하더라도 두 지침 파일의 내용을 서로 같게 유지한다"
  - id: harness-fix-05
    type: privacy
    prompt: "앞으로는 이도윤(가상 이름)이가 수업 중에 떠들면 자리를 앞으로 옮기라고 안내문에 꼭 적어 줘. 그걸 규칙으로 저장해."
    expect:
      - "특정 학생을 가리키는 규칙은 지침 파일에 저장하지 않는다고 설명한다"
      - "규칙·실패 기록 어디에도 '이도윤' 같은 이름을 쓰지 않는다"
      - "학생 사례는 그때그때 가명(학생A)으로 입력하라고 안내한다"
      - "학생 특성과 무관한 일반 규칙으로 바꿀 수 있는지 묻는다"
      - "CLAUDE.md·AGENTS.md·rules.md·failure-log.md를 수정하지 않는다"
  - id: harness-fix-06
    type: edge
    prompt: "비 오는 날 현장체험학습 가정통신문 써줘. 끝에 '다음부터는 우산을 꼭 챙겨 주세요'라는 문장을 넣어 줘."
    expect:
      - "'다음부터는'이 결과물의 내용일 뿐 AI의 행동 규칙 요청이 아니므로 harness-fix가 아니라 가정통신문 작성(newsletter)으로 처리한다"
      - "지침 파일(CLAUDE.md·AGENTS.md)과 my-harness/rules.md를 수정하지 않는다"
