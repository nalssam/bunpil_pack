<?xml version="1.0" encoding="UTF-8"?>
<!--
  분필팩 컬러링 도안 A4 틀 (세로, 단위 mm).
  사용법:
  1) {{제목}}을 바꾼다. 이름 칸은 비워 둔다.
  2) 선화는 <g id="artwork"> 안에 넣는다. 그리는 범위는 x 12~198, y 47~265.
  3) 번호 색칠이 아니면 <g id="color-key">를 통째로 지운다.
  4) 선화 규칙: stroke만 쓰고(fill="none"), 모든 도형은 닫힌 영역, 선 굵기는 학년에 맞춘다(참고: references/line-art-guide.md).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"
     font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <title>컬러링 도안 틀</title>
  <desc>A4 세로. 제목 칸, 이름 칸, 그림 영역, 번호 색칠 안내 칸. 초안이며 인쇄 전 교사가 확인한다.</desc>
  <defs>
    <clipPath id="art-clip"><rect x="12" y="47" width="186" height="218" rx="3"/></clipPath>
  </defs>
  <rect x="0" y="0" width="210" height="297" fill="#ffffff"/>

  <g id="header" fill="none" stroke="#000000">
    <rect id="title-box" x="10" y="10" width="190" height="18" rx="3" stroke-width="0.8"/>
    <text x="105" y="22" font-size="8" font-weight="bold" fill="#000" stroke="none" text-anchor="middle">{{제목}}</text>
    <rect id="name-box" x="10" y="31" width="190" height="11" rx="2" stroke-width="0.5"/>
    <text x="14" y="38.5" font-size="4.5" fill="#000" stroke="none">이름</text>
    <line x1="25" y1="39" x2="95" y2="39" stroke-width="0.3"/>
    <text x="104" y="38.5" font-size="4.5" fill="#000" stroke="none">반</text>
    <line x1="111" y1="39" x2="130" y2="39" stroke-width="0.3"/>
    <text x="140" y="38.5" font-size="4.5" fill="#000" stroke="none">번호</text>
    <line x1="152" y1="39" x2="190" y2="39" stroke-width="0.3"/>
  </g>

  <rect id="art-frame" x="10" y="45" width="190" height="222" rx="4" fill="none" stroke="#000000" stroke-width="1.2"/>

  <!-- 선화 영역: 여기에 stroke만 있는 닫힌 도형을 넣는다 -->
  <g id="artwork" clip-path="url(#art-clip)" fill="none" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- 예: <path d="M..." /> -->
  </g>

  <!-- 번호 색칠 안내 (필요 없으면 이 그룹을 지운다). 동그라미는 학생이 해당 색으로 칠해 본다 -->
  <g id="color-key" fill="none" stroke="#000000" stroke-width="0.5">
    <rect x="10" y="270" width="190" height="19" rx="3"/>
    <text x="14" y="276" font-size="3.6" fill="#000" stroke="none">번호에 맞는 색으로 칠해요</text>
    <g font-size="4" fill="#000" stroke="none" text-anchor="start">
      <circle cx="19" cy="283" r="3" fill="none" stroke="#000" stroke-width="0.5"/><text x="23.5" y="284.4">1 {{색}}</text>
      <circle cx="46" cy="283" r="3" fill="none" stroke="#000" stroke-width="0.5"/><text x="50.5" y="284.4">2 {{색}}</text>
      <circle cx="73" cy="283" r="3" fill="none" stroke="#000" stroke-width="0.5"/><text x="77.5" y="284.4">3 {{색}}</text>
      <circle cx="100" cy="283" r="3" fill="none" stroke="#000" stroke-width="0.5"/><text x="104.5" y="284.4">4 {{색}}</text>
      <circle cx="127" cy="283" r="3" fill="none" stroke="#000" stroke-width="0.5"/><text x="131.5" y="284.4">5 {{색}}</text>
      <circle cx="154" cy="283" r="3" fill="none" stroke="#000" stroke-width="0.5"/><text x="158.5" y="284.4">6 {{색}}</text>
    </g>
  </g>

  <text x="10" y="294.5" font-size="2.8" fill="#666">초안 · 독창 도안 · 교사 확인 후 인쇄</text>
</svg>
