<?xml version="1.0" encoding="UTF-8"?>
<!-- 예시: 초1~2 '가을 열매' 번호 색칠 (독창 도안, 닫힌 영역 9개, 선 굵기 1.6mm) -->
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"
     font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <title>가을 열매 번호 색칠</title>
  <desc>감, 도토리, 사과. 번호 1 주황, 2 초록, 3 갈색, 4 빨강, 5 연한 노랑.</desc>
  <defs>
    <clipPath id="art-clip"><rect x="12" y="47" width="186" height="218" rx="3"/></clipPath>
  </defs>
  <rect x="0" y="0" width="210" height="297" fill="#ffffff"/>

  <g id="header" fill="none" stroke="#000000">
    <rect x="10" y="10" width="190" height="18" rx="3" stroke-width="0.8"/>
    <text x="105" y="22" font-size="8" font-weight="bold" fill="#000" stroke="none" text-anchor="middle">가을 열매 색칠하기</text>
    <rect x="10" y="31" width="190" height="11" rx="2" stroke-width="0.5"/>
    <text x="14" y="38.5" font-size="4.5" fill="#000" stroke="none">이름</text>
    <line x1="25" y1="39" x2="95" y2="39" stroke-width="0.3"/>
    <text x="104" y="38.5" font-size="4.5" fill="#000" stroke="none">반</text>
    <line x1="111" y1="39" x2="130" y2="39" stroke-width="0.3"/>
    <text x="140" y="38.5" font-size="4.5" fill="#000" stroke="none">번호</text>
    <line x1="152" y1="39" x2="190" y2="39" stroke-width="0.3"/>
  </g>
  <rect x="10" y="45" width="190" height="222" rx="4" fill="none" stroke="#000000" stroke-width="1.2"/>

  <g id="artwork" clip-path="url(#art-clip)" fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- 감 -->
    <ellipse cx="60" cy="120" rx="34" ry="29"/>
    <path d="M38 102 L50 96 L60 101 L70 96 L82 102 L72 109 L60 105 L48 109 Z"/>
    <path d="M57 78 L63 78 L63 91 L57 91 Z"/>
    <g id="num-persimmon" font-size="7" fill="#000" stroke="none" text-anchor="middle">
      <text x="60" y="133">1</text><text x="60" y="106.5">2</text><text x="60" y="87" font-size="5">3</text>
    </g>
    <!-- 도토리 -->
    <path d="M132 124 Q132 168 153 176 Q174 168 174 124 Z"/>
    <path d="M128 124 Q128 98 153 96 Q178 98 178 124 Z"/>
    <path d="M150 86 L156 86 L156 97 L150 97 Z"/>
    <g id="num-acorn" font-size="7" fill="#000" stroke="none" text-anchor="middle">
      <text x="153" y="152">5</text><text x="153" y="115">3</text><text x="153" y="94.5" font-size="4.5">3</text>
    </g>
    <!-- 사과 -->
    <path d="M105 194 C85 181 60 196 65 221 C70 251 95 261 105 254 C115 261 140 251 145 221 C150 196 125 181 105 194 Z"/>
    <path d="M110 176 C116 160 130 158 138 164 C131 176 119 179 110 176 Z"/>
    <path d="M103 176 L108 176 L108 193.5 L103 193.5 Z"/>
    <g id="num-apple" font-size="7" fill="#000" stroke="none" text-anchor="middle">
      <text x="105" y="226">4</text><text x="124" y="170" font-size="5">2</text><text x="105.5" y="187" font-size="4">3</text>
    </g>
  </g>

  <g id="color-key" fill="none" stroke="#000000" stroke-width="0.5">
    <rect x="10" y="270" width="190" height="19" rx="3"/>
    <text x="14" y="276" font-size="3.6" fill="#000" stroke="none">번호에 맞는 색으로 칠해요</text>
    <g font-size="4" fill="#000" stroke="none">
      <circle cx="19" cy="283" r="3" fill="none" stroke="#000" stroke-width="0.5"/><text x="23.5" y="284.4">1 주황</text>
      <circle cx="46" cy="283" r="3" fill="none" stroke="#000" stroke-width="0.5"/><text x="50.5" y="284.4">2 초록</text>
      <circle cx="73" cy="283" r="3" fill="none" stroke="#000" stroke-width="0.5"/><text x="77.5" y="284.4">3 갈색</text>
      <circle cx="100" cy="283" r="3" fill="none" stroke="#000" stroke-width="0.5"/><text x="104.5" y="284.4">4 빨강</text>
      <circle cx="127" cy="283" r="3" fill="none" stroke="#000" stroke-width="0.5"/><text x="131.5" y="284.4">5 연한 노랑</text>
    </g>
  </g>
  <text x="10" y="294.5" font-size="2.8" fill="#666">초안 · 독창 도안 · 교사 확인 후 인쇄</text>
</svg>
